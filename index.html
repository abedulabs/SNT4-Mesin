<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Simulator Mesin Ringkas | Sains Tahun 4</title>
<style>
:root{--ink:#173b4a;--teal:#146f69;--cream:#fffdf5;--sand:#eee5cf;--line:#d4c9ac;--red:#d85d46}
*{box-sizing:border-box}body{margin:0;background:#e8eddf;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{padding:24px 18px 20px;background:linear-gradient(120deg,#123e52,#117c79);color:white}
header h1{margin:0 0 8px;font-size:clamp(26px,6vw,40px)}header p{margin:0;font-size:17px;line-height:1.5}
main{max-width:900px;margin:auto;padding:14px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:4px 0 16px}
.tabs button,.btn{border:2px solid var(--line);background:var(--sand);color:#23434b;border-radius:13px;padding:13px 10px;font-weight:700;font-size:16px;cursor:pointer}
.tabs button.active,.btn.primary{background:var(--teal);color:white;border-color:var(--teal)}
.card{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 4px 16px #173b4a0d}
h2{font-size:25px;margin:0 0 10px} .desc{font-size:17px;line-height:1.55;margin:0 0 14px;color:#293c43}
figure{margin:0 0 15px;border:2px solid #d8d1bb;border-radius:15px;background:#f3efdf;padding:8px}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.control{margin:16px 0}.control label{display:block;font-weight:700;font-size:16px;margin-bottom:8px}
.range{display:grid;grid-template-columns:38px minmax(0,1fr) 38px 78px;gap:7px;align-items:center}
.range button{height:38px;border:1px solid var(--line);border-radius:10px;background:#f4ecd9;color:var(--ink);font-size:22px;font-weight:bold}
input[type=range]{width:100%;accent-color:var(--teal)}
input[type=number]{width:100%;padding:8px 3px;border:2px solid var(--line);border-radius:9px;background:white;text-align:center;color:var(--ink);font-size:16px;font-weight:bold}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:13px 16px;font-size:16px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.status{font-size:16px;font-weight:700;color:var(--teal);margin:13px 0 0;min-height:25px}
.tip{background:#eef4e7;border-left:5px solid #789363;padding:13px;border-radius:10px;line-height:1.5;margin-top:12px}
.small{font-size:13px;color:#60716b;text-align:center;margin:5px}
@media(min-width:650px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:24px}.desc{font-size:18px}}
</style>
</head>
<body>
<header><h1>🛠️ Makmal Mesin Ringkas</h1><p>Sains Tahun 4 · Tekan, tahan dan perhatikan bagaimana mesin ringkas membantu melakukan kerja.</p></header>
<main>
<nav class="tabs" id="tabs" aria-label="Pilih mesin ringkas"></nav>
<section class="card">
<h2 id="title"></h2><p class="desc" id="desc"></p>
<figure><div id="scene"></div><figcaption class="small" id="caption"></figcaption></figure>
<div id="controls"></div>
<div class="actionrow" id="actions"></div>
<p class="status" id="status" aria-live="polite">Pilih tetapan dan tekan DAYA untuk mencuba.</p>
<div class="tip" id="tip">Pemerhatian: Apakah yang bergerak apabila daya dikenakan?</div>
</section>
</main>
<script>
const machines=[
{id:'tuas',name:'1. Tuas',title:'Tuas — jongkang-jongket',desc:'Tekan dan tahan DAYA. Hujung tempat daya dikenakan turun, manakala hujung bertentangan naik. Fulkrum ialah titik sokongan.',caption:'Tuas berpusing pada fulkrum.',controls:[['ful','Kedudukan fulkrum (cm)',20,80,50,5,' cm'],['load','Beban (kg)',10,100,40,10,' kg'],['force','Daya (N)',10,100,50,10,' N']],button:'👇 TEKAN & TAHAN DAYA'},
{id:'takal',name:'2. Takal',title:'Takal — mengangkat beban',desc:'Tekan dan tahan TARIK. Tarik tali ke bawah untuk menaikkan beban. Takal tetap menukar arah daya.',caption:'Tarik tali ke bawah, beban bergerak ke atas.',controls:[['load','Beban (kg)',10,100,40,10,' kg'],['force','Daya tarikan (N)',10,100,50,10,' N']],button:'👇 TEKAN & TAHAN TARIK'},
{id:'roda',name:'3. Roda dan gandar',title:'Roda dan gandar — penggulung tali',desc:'Tekan dan tahan PUTAR. Pemegang berpusing, gandar menggulung tali dan mengangkat batu ladung.',caption:'Putaran roda memutarkan gandar untuk menggulung tali.',controls:[['load','Beban batu ladung (kg)',1,20,5,1,' kg'],['force','Daya putaran (N)',10,100,50,10,' N']],button:'↻ TEKAN & TAHAN PUTAR'},
{id:'baji',name:'4. Baji',title:'Baji — kapak membelah kayu',desc:'Tekan dan tahan KETUK. Bucu tajam baji masuk ke kayu dan menolak bahagian atas kayu menjauhi satu sama lain.',caption:'Rekahan berbentuk V terbuka dari permukaan atas kayu.',controls:[['load','Rintangan kayu (kg)',10,100,40,10,' kg'],['force','Daya ketukan (N)',10,100,50,10,' N']],button:'🔨 TEKAN & TAHAN KETUK'},
{id:'satah',name:'5. Satah condong',title:'Satah condong — kereta menaiki cerun',desc:'Tekan dan tahan TOLAK. Kereta bergerak perlahan-lahan menaiki cerun. Cerun lebih landai membantu menaikkan beban dengan lebih mudah.',caption:'Satah condong ialah permukaan cerun yang membantu menaikkan beban.',controls:[['angle','Ketinggian cerun (%)',15,45,30,5,' %'],['load','Beban kereta (kg)',10,100,40,10,' kg'],['force','Daya tolakan (N)',10,100,50,10,' N']],button:'👆 TEKAN & TAHAN TOLAK'},
{id:'skru',name:'6. Skru',title:'Skru — penutup botol berulir',desc:'Tekan BUKA untuk memutarkan penutup lawan arah jam dan mengangkatnya. Tekan KUNCI untuk memutarkan penutup ikut arah jam dan menutup botol.',caption:'Ulir penutup bergerak sepanjang ulir leher botol.',controls:[['turns','Bilangan putaran',1,10,5,1,' pusingan']],button:'↻ BUKA / KUNCI'}
];
let current='tuas',values={},progress=0,timer=null,active=false,direction=1,completed=new Set();
const $=id=>document.getElementById(id);
function machine(){return machines.find(m=>m.id===current)}
function initValues(m){values={};m.controls.forEach(c=>values[c[0]]=c[4]);progress=0}
function renderTabs(){$('tabs').innerHTML=machines.map(m=>`<button class="${m.id===current?'active':''}" data-machine="${m.id}">${m.name}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>selectMachine(b.dataset.machine))}
function selectMachine(id){stop();current=id;initValues(machine());renderTabs();renderMachine()}
function renderMachine(){
 const m=machine();$('title').textContent=m.title;$('desc').textContent=m.desc;$('caption').textContent=m.caption;
 $('controls').innerHTML=m.controls.map(c=>`<div class="control"><label for="r_${c[0]}">${c[1]}</label><div class="range"><button data-key="${c[0]}" data-d="-${c[5]}" aria-label="Kurangkan">−</button><input type="range" id="r_${c[0]}" min="${c[2]}" max="${c[3]}" step="${c[5]}" value="${values[c[0]]}"><button data-key="${c[0]}" data-d="${c[5]}" aria-label="Tambah">+</button><input type="number" id="n_${c[0]}" min="${c[2]}" max="${c[3]}" step="${c[5]}" value="${values[c[0]]}" aria-label="Nilai ${c[1]}"></div></div>`).join('');
 m.controls.forEach(c=>{const r=$('r_'+c[0]),n=$('n_'+c[0]);const sync=v=>{let x=Number(v);if(!Number.isFinite(x))return;x=Math.max(c[2],Math.min(c[3],x));x=c[2]+Math.round((x-c[2])/c[5])*c[5];x=Math.max(c[2],Math.min(c[3],x));values[c[0]]=x;r.value=x;n.value=x;draw()};r.oninput=()=>sync(r.value);n.onchange=()=>sync(n.value);n.onkeydown=e=>{if(e.key==='Enter'){sync(n.value);n.blur()}}});
 $('controls').querySelectorAll('button[data-key]').forEach(b=>b.onclick=()=>{const c=m.controls.find(x=>x[0]===b.dataset.key);values[c[0]]=Math.max(c[2],Math.min(c[3],values[c[0]]+Number(b.dataset.d)));$('r_'+c[0]).value=values[c[0]];$('n_'+c[0]).value=values[c[0]];draw()});
 $('actions').innerHTML=current==='skru'?`<button class="btn primary" id="open">↺ TEKAN & TAHAN BUKA</button><button class="btn primary" id="lock">↻ TEKAN & TAHAN KUNCI</button><button class="btn" id="reset">Tetapkan semula</button>`:`<button class="btn primary" id="hold">${m.button}</button><button class="btn" id="reset">Tetapkan semula</button>`;
 if(current==='skru'){bindHold($('open'),1);bindHold($('lock'),-1)}else bindHold($('hold'),1);
 $('reset').onclick=()=>{stop();progress=0;draw();$('status').textContent='Simulasi ditetapkan semula.';$('tip').textContent='Pemerhatian: Cuba tekan dan tahan daya semula.'};
 $('status').textContent='Sedia untuk diuji.';draw();
}
function bindHold(el,dir){el.addEventListener('pointerdown',e=>{e.preventDefault();start(dir)});['pointerup','pointercancel','pointerleave','pointerout'].forEach(ev=>el.addEventListener(ev,stop))}
function start(dir){if(active)return;active=true;direction=dir;const burden=Number(values.load||40),force=Number(values.force||50);const rate=Math.max(.12,(.55+force/100)/(1+burden/100));$('status').textContent='Daya dikenakan… terus tahan untuk meneruskan gerakan.';timer=setInterval(()=>{progress=current==='skru'?Math.max(0,Math.min(100,progress+rate*direction)):Math.min(100,progress+rate);draw();if((current==='skru'&&(progress===0||progress===100))||(current!=='skru'&&progress>=100)){stop();completed.add(current);$('status').textContent=current==='skru'?(progress===100?'Penutup terbuka. Tekan KUNCI untuk menutup.':'Penutup tertutup. Tekan BUKA untuk membuka.'):'Gerakan selesai. Cuba ubah nilai dan uji sekali lagi.';$('tip').textContent=observation() }},50)}
function stop(){if(timer){clearInterval(timer);timer=null}active=false}
function observation(){return ({tuas:'Fulkrum menjadi titik sokongan. Hujung daya turun dan hujung beban naik.',takal:'Tarikan ke bawah menaikkan beban. Takal tetap mengubah arah daya.',roda:'Roda dan gandar berputar bersama; tali digulung lalu batu ladung naik.',baji:'Bucu tajam masuk ke kayu dan menghasilkan rekahan berbentuk V di bahagian atas.',satah:'Kereta bergerak di sepanjang cerun. Cerun lebih landai memudahkan pergerakan.',skru:'Ulir menukarkan putaran penutup kepada gerakan naik atau turun.'})[current]}
function draw(){
 const p=Math.max(0,Math.min(100,progress)),v=values,load=Number(v.load||40);let s=`<svg viewBox="0 0 600 280" role="img" aria-label="${machine().title}"><rect x="8" y="8" width="584" height="264" rx="12" fill="#fffdf5" stroke="#d1c7b1" stroke-width="2"/>`;
 if(current==='tuas'){let ful=100+(Number(v.ful)-20)/60*400,ang=p*.10*(Number(v.force)/50),cy=145;s+=`<line x1="45" y1="225" x2="555" y2="225" stroke="#9aaf9e" stroke-width="4"/><polygon points="${ful-30},220 ${ful+30},220 ${ful},${cy+12}" fill="#d6a936" stroke="#8b681d" stroke-width="3"/><g transform="rotate(${ang} ${ful} ${cy})"><rect x="65" y="${cy-7}" width="470" height="14" rx="5" fill="#b98b50" stroke="#805c31" stroke-width="3"/><circle cx="125" cy="${cy-28}" r="17" fill="#f0c4a0" stroke="#805c31" stroke-width="2"/><path d="M104 ${cy-8} Q125 ${cy-30} 146 ${cy-8}Z" fill="#4778cb"/><circle cx="490" cy="${cy-28}" r="17" fill="#f0c4a0" stroke="#805c31" stroke-width="2"/><path d="M469 ${cy-8} Q490 ${cy-30} 511 ${cy-8}Z" fill="#e1a34c"/></g><line x1="490" y1="75" x2="490" y2="110" stroke="#d95c46" stroke-width="6"/><polygon points="480,103 500,103 490,120" fill="#d95c46"/><text x="490" y="64" fill="#a33b2b" font-size="14" font-weight="bold" text-anchor="middle">DAYA ↓</text><text x="125" y="106" fill="#315fa8" font-size="14" font-weight="bold" text-anchor="middle">${load} kg</text><text x="490" y="106" fill="#a66a1f" font-size="14" font-weight="bold" text-anchor="middle">${v.force} N</text><text x="${ful}" y="253" fill="#53675f" font-size="12" text-anchor="middle">Fulkrum: ${v.ful} cm</text>`}
 if(current==='takal'){let y=185-p*.85;s+=`<line x1="180" y1="35" x2="420" y2="35" stroke="#6b8a84" stroke-width="10"/><circle cx="300" cy="70" r="25" fill="#f0d86b" stroke="#315f83" stroke-width="5"/><circle cx="300" cy="70" r="5" fill="#315f83"/><path d="M275 70 Q275 45 300 45 Q325 45 325 70 V${y}" fill="none" stroke="#b98b50" stroke-width="5"/><path d="M275 70 L100 185" fill="none" stroke="#b98b50" stroke-width="5"/><line x1="100" y1="185" x2="100" y2="225" stroke="#d95c46" stroke-width="6"/><polygon points="90,218 110,218 100,235" fill="#d95c46"/><rect x="276" y="${y}" width="80" height="48" rx="3" fill="#8d969b" stroke="#4e5960" stroke-width="3"/><text x="316" y="${y+29}" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">${load} kg</text><text x="100" y="165" fill="#a33b2b" font-size="13" font-weight="bold">DAYA ↓</text><text x="400" y="253" fill="#53675f" font-size="12" text-anchor="middle">Beban naik apabila tali ditarik</text>`}
 if(current==='roda'){let rot=p*5,sink=205-p*.8;s+=`<line x1="65" y1="224" x2="535" y2="224" stroke="#9aaf9e" stroke-width="4"/><circle cx="235" cy="125" r="65" fill="#f0d64f" stroke="#315fa8" stroke-width="8"/><circle cx="235" cy="125" r="20" fill="#d95c46" stroke="#963c2d" stroke-width="4"/><g transform="rotate(${rot} 235 125)" stroke="#315fa8" stroke-width="6"><line x1="177" y1="125" x2="293" y2="125"/><line x1="235" y1="67" x2="235" y2="183"/><line x1="235" y1="125" x2="285" y2="160" stroke="#d95c46" stroke-width="8"/><circle cx="285" cy="160" r="9" fill="#d95c46"/></g><path d="M255 125 Q330 125 355 157 L355 ${sink-12}" fill="none" stroke="#b98b50" stroke-width="4"/><path d="M345 ${sink-12} H365 L360 ${sink+8} Q355 ${sink+18} 350 ${sink+8}Z" fill="#6d7780" stroke="#37434b" stroke-width="2"/><text x="385" y="62" fill="#a33b2b" font-size="13" font-weight="bold">PUTAR PEMEGANG</text><text x="390" y="${sink+35}" fill="#53675f" font-size="13" font-weight="bold">${load} kg</text><text x="235" y="216" fill="#53675f" font-size="12" text-anchor="middle">Gandar menggulung tali</text>`}
 if(current==='baji'){let tip=Math.min(195,115+p*.65),top=18+p*.1;s+=`<rect x="145" y="110" width="310" height="110" fill="#c9b995" stroke="#8b795a" stroke-width="3"/><path d="M145 110 H278 L300 ${tip} L278 110Z M455 110 H322 L300 ${tip} L322 110Z" fill="#b9a77e" stroke="#8b795a" stroke-width="2"/><path d="M278 110 L300 ${tip} L322 110" stroke="#6e6048" stroke-width="3" fill="none"/><g transform="translate(300 ${top})"><path d="M-25 -10 Q0 -25 25 -10 L25 13 L10 22 L-10 22 L-25 13Z" fill="#a9bbc0" stroke="#4e6c74" stroke-width="3"/><polygon points="-12,20 12,20 0,${Math.max(25,tip-top)}" fill="#a9bbc0" stroke="#4e6c74" stroke-width="3"/><rect x="-4" y="18" width="8" height="35" rx="3" fill="#b98b50" stroke="#805c31" stroke-width="2"/></g><line x1="300" y1="5" x2="300" y2="18" stroke="#d95c46" stroke-width="6"/><polygon points="290,14 310,14 300,29" fill="#d95c46"/><text x="405" y="42" fill="#a33b2b" font-size="13" font-weight="bold">KETUK KAPAK</text><text x="300" y="253" fill="#53675f" font-size="12" text-anchor="middle">Rekahan V di bahagian atas</text>`}
 if(current==='satah'){let angle=Number(v.angle),x=Math.min(440,100+p*2.8),y=215-(x-70)*Math.tan(angle*Math.PI/180)*.35;s+=`<polygon points="70,215 500,215 500,${215-430*Math.tan(angle*Math.PI/180)*.35}" fill="#e2c28d" stroke="#8c6a37" stroke-width="3"/><line x1="70" y1="215" x2="500" y2="${215-430*Math.tan(angle*Math.PI/180)*.35}" stroke="#8c6a37" stroke-width="5"/><g transform="translate(${x-22},${y-25}) rotate(${-angle*0.35})"><rect width="48" height="29" rx="5" fill="#d95c46" stroke="#963c2d" stroke-width="3"/><circle cx="10" cy="31" r="6" fill="#303b43"/><circle cx="38" cy="31" r="6" fill="#303b43"/></g><text x="120" y="60" fill="#a33b2b" font-size="13" font-weight="bold">TOLAK KERETA ↑</text><text x="310" y="253" fill="#53675f" font-size="12" text-anchor="middle">Ketinggian cerun: ${angle}%</text>`}
 if(current==='skru'){let open=Math.max(0,Math.min(100,p)),rot=(100-open)*3.6;s+=`<path d="M215 105 L225 91 V76 Q225 68 237 68 H363 Q375 68 375 76 V91 L385 105 V210 Q385 225 370 225 H230 Q215 225 215 210Z" fill="#c8e5ec" stroke="#5b9aaa" stroke-width="3"/><rect x="265" y="64" width="70" height="52" fill="#fffdf5" stroke="#5b9aaa" stroke-width="2"/><path d="M266 72 l12 6 l-12 6 l12 6 l-12 6 l12 6 M334 72 l-12 6 l12 6 l-12 6 l12 6 l-12 6" fill="none" stroke="#397d8d" stroke-width="3"/><g transform="translate(0 ${-open*.42})"><g transform="translate(300 78) rotate(${rot})"><path d="M-43 -12 H43 Q48 -12 48 -5 V10 H-48 V-5 Q-48 -12 -43 -12Z" fill="#d95c46" stroke="#963c2d" stroke-width="3"/><path d="M-38 -5 H38 M-38 2 H38" stroke="#f8d4c8" stroke-width="2"/></g></g><rect x="425" y="91" width="125" height="110" rx="8" fill="#f7f1df" stroke="#d1c7b1" stroke-width="2"/><path d="M442 113 H533 V180 H442Z" fill="#d6eef2" stroke="#5b9aaa" stroke-width="2"/><path d="M444 121 l15 7 l-15 7 l15 7 l-15 7 l15 7 l-15 7 M531 121 l-15 7 l15 7 l-15 7 l15 7 l-15 7 l15 7" fill="none" stroke="#397d8d" stroke-width="3"/><path d="M449 105 H526 V120 H449Z" fill="#d95c46" stroke="#963c2d" stroke-width="2"/><text x="300" y="36" fill="#53675f" font-size="12" font-weight="bold" text-anchor="middle">BOTOL PLASTIK + PENUTUP</text><text x="487" y="215" fill="#53675f" font-size="10" text-anchor="middle">KERATAN ULIR</text><text x="300" y="253" fill="#53675f" font-size="12" text-anchor="middle">${open>85?'Penutup terbuka':open<15?'Penutup dikunci':'Penutup bergerak'}</text>`}
 s+='</svg>';$('scene').innerHTML=s;
}
renderTabs();initValues(machine());renderMachine();
</script>
</body></html>
